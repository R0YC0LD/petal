[package]
name = "petal"
version = "0.9.11"
edition = "2021"

[lib]
name = "petal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
file_icon_provider = "1.0.2"
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Performance", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Media", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Devices_Display", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Accessibility"] }
winreg = "0.56.0"
tauri-plugin-global-shortcut = "2.4.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
